version: 2

project_name: mtb

builds:
  - main: ./cmd/mtb
    binary: mtb
    ldflags:
      - -s -w -X github.com/ideamans/mtb/internal/cmd.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # アーカイブ名・リポジトリ名・バイナリ名はどれも mtb（v0.1.1 から。
  # v0.1.0 だけは旧名 movable-type-builder-cli_* のアーカイブ）。
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
